name: Check template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check local links and assets
        run: python3 scripts/check.py
      - name: Check JavaScript syntax
        run: node --check assets/js/click-effects.js
